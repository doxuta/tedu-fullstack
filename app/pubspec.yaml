name: tedu
description: "TEdu — sổ quản lý dạy học cho gia sư. Client Flutter đa nền tảng (iOS, Android, macOS, Windows, Linux)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^8.1.7
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
