# TEdu — Postgres cho môi trường dev
# Chạy: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: tedu-db
    environment:
      POSTGRES_USER: tedu
      POSTGRES_PASSWORD: tedu_dev_password
      POSTGRES_DB: tedu
    ports:
      - "5433:5432"   # 5433 phía máy thật (tránh đụng Postgres local nếu có)
    volumes:
      - tedu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tedu"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tedu_pgdata:
